# Default values for pinglow-frontend Helm chart
replicaCount: 1

image:
  repository: ghcr.io/sbettid/pinglow-frontend
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion

imagePullSecrets: []

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

# Pinglow API configuration
pinglow:
  # URL to the Pinglow backend API (e.g., http://pinglow:80)
  # This can be an internal service URL in Kubernetes
  apiUrl: http://pinglow:80

resources:
  limits:
    cpu: 256m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

